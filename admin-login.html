<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Login Admin</title>
<style>
:root{--ink:#171616;--muted:#746d61;--line:rgba(128,91,24,.18);--gold:#c99722;--gold2:#8f6412;--paper:#fffdf7;--bg:#f7f1e5;--danger:#9d2c2c;--ok:#38643a;--shadow:0 24px 70px rgba(92,65,14,.14)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fffdf8,#f6ecd7 55%,#ead3a3)}
.card{width:min(440px,100%);background:rgba(255,254,250,.97);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--gold2)}h1{font-size:26px;margin:8px 0 8px}.sub{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.6}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:800}.field input{width:100%;min-height:50px;border:1px solid #d9d0c1;border-radius:14px;padding:0 14px;font:inherit;outline:none;background:#fff}.field input:focus{border-color:#b9851b;box-shadow:0 0 0 4px rgba(205,158,51,.15)}button{width:100%;min-height:50px;border:0;border-radius:14px;margin-top:14px;background:linear-gradient(135deg,#e6bb46,#a8750d);color:#fff;font-weight:900;font-size:14px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.status{min-height:20px;margin-top:13px;font-size:12px;line-height:1.5;color:var(--muted)}.status.error{color:var(--danger)}.status.ok{color:var(--ok)}.hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<main class="card" aria-labelledby="title">
  <div class="eyebrow">Admin Panel</div>
  <h1 id="title">Login Admin</h1>
  <p class="sub">Masukkan Token Admin yang sama dengan <code>ADMIN_TOKEN</code> pada backend realtime.</p>
  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="adminToken">Token Admin</label>
      <input id="adminToken" name="adminToken" type="password" minlength="24" required autocomplete="current-password" spellcheck="false" aria-describedby="loginStatus">
    </div>
    <button id="loginBtn" type="submit">Masuk Admin Panel</button>
    <div class="status" id="loginStatus" aria-live="polite"></div>
  </form>
  <div class="hint">Token tidak ditambahkan ke URL dan hanya disimpan di <code>sessionStorage</code> pada tab browser Admin setelah backend berhasil memverifikasinya.</div>
</main>
<script src="realtime-config.js"></script>
<script>
(() => {
  'use strict';
  const TOKEN_KEY='kbRealtimeAdminToken';
  const form=document.getElementById('loginForm');
  const input=document.getElementById('adminToken');
  const button=document.getElementById('loginBtn');
  const status=document.getElementById('loginStatus');
  const base=String(window.KBRealtimeConfig?.baseUrl||'').trim().replace(/\/+$/,'');

  function setStatus(message,type=''){
    status.textContent=message;
    status.className=`status${type?` ${type}`:''}`;
  }
  async function verify(token){
    const response=await fetch(`${base}/admin/auth`,{
      method:'POST',mode:'cors',credentials:'omit',cache:'no-store',
      headers:{'X-Admin-Token':token}
    });
    return response;
  }
  async function tryExisting(){
    let token='';
    try{token=sessionStorage.getItem(TOKEN_KEY)||''}catch{}
    if(!token||!base)return;
    try{
      const response=await verify(token);
      if(response.ok){location.replace('admin-simulasi.html');return;}
      if(response.status===401){try{sessionStorage.removeItem(TOKEN_KEY)}catch{}}
    }catch{}
  }

  if(!base){
    input.disabled=true;button.disabled=true;
    setStatus('Backend realtime belum dikonfigurasi pada realtime-config.js.','error');
  }else{
    void tryExisting();
  }

  form.addEventListener('submit',async event=>{
    event.preventDefault();
    const token=input.value.trim();
    if(token.length<24){setStatus('Token Admin minimal 24 karakter.','error');return;}
    button.disabled=true;input.disabled=true;setStatus('Memverifikasi akses Admin…');
    try{
      const response=await verify(token);
      if(response.status===401){setStatus('Token Admin tidak valid.','error');return;}
      if(response.status===403){setStatus('Origin website belum diizinkan oleh backend.','error');return;}
      if(!response.ok){setStatus(`Backend merespons HTTP ${response.status}.`,'error');return;}
      try{sessionStorage.setItem(TOKEN_KEY,token)}catch{setStatus('Browser tidak mengizinkan penyimpanan sesi Admin.','error');return;}
      setStatus('Login berhasil. Membuka Admin Panel…','ok');
      location.replace('admin-simulasi.html');
    }catch{
      setStatus('Backend realtime tidak dapat dihubungi. Periksa URL backend dan koneksi internet.','error');
    }finally{
      button.disabled=false;input.disabled=false;
    }
  });
})();
</script>
</body>
</html>
